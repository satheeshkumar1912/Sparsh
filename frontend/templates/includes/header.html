{% load static %}
<header class="site-header" role="banner">
  <div class="site-header__inner">
    <a class="brand" href="{% url 'core:home' %}" data-track="nav-logo">
      <img
        src="{% static 'img/logo.png' %}"
        alt="Sparsh Inclusive Education — Different Abilities. Limitless Possibilities."
        width="140"
        height="64"
        class="brand__logo"
      >
    </a>

    <button
      type="button"
      class="nav-toggle"
      aria-controls="primary-nav"
      aria-expanded="false"
      aria-label="Open menu"
      data-nav-toggle
    >
      <span class="nav-toggle__bars" aria-hidden="true"></span>
    </button>

    <div class="nav-backdrop" data-nav-backdrop hidden></div>

    <nav id="primary-nav" class="primary-nav" aria-label="Primary" data-primary-nav>
      <div class="primary-nav__panel">
        <div class="primary-nav__top">
          <p class="primary-nav__label">Menu</p>
          <button type="button" class="nav-close" aria-label="Close menu" data-nav-close>&times;</button>
        </div>
        <ul class="primary-nav__list">
          {% for item in NAV_ITEMS %}
          {% if item.dropdown %}
          <li class="nav-item nav-item--dropdown" data-nav-dropdown>
            <button
              type="button"
              class="primary-nav__link nav-dropdown__trigger"
              aria-expanded="false"
              aria-haspopup="true"
              aria-controls="nav-dropdown-menu-{{ forloop.counter }}"
              data-nav-dropdown-trigger
              data-track="nav-{{ item.label|slugify }}"
            >
              {{ item.label }}
              <span class="nav-dropdown__chevron" aria-hidden="true"></span>
            </button>
            <ul id="nav-dropdown-menu-{{ forloop.counter }}" class="nav-dropdown" data-nav-dropdown-menu>
              {% for option in item.dropdown %}
              <li>
                <span class="nav-dropdown__item" role="presentation">{{ option }}</span>
              </li>
              {% endfor %}
            </ul>
          </li>
          {% else %}
          <li class="nav-item">
            <a
              href="{% url item.url_name %}"
              class="primary-nav__link{% if request.resolver_match.view_name == item.url_name %} is-active{% endif %}"
              {% if request.resolver_match.view_name == item.url_name %}aria-current="page"{% endif %}
              data-track="nav-{{ item.label|slugify }}"
            >{{ item.label }}</a>
          </li>
          {% endif %}
          {% endfor %}
        </ul>
        <a
          href="{% static 'files/SPARSH_8-Page_A4_Landscape_Brochure.pdf' %}"
          class="btn btn--brochure primary-nav__cta"
          data-track="nav-brochure-cta"
          download="SPARSH_8-Page_A4_Landscape_Brochure.pdf"
          aria-label="Download Brochure"
        >
          <svg class="btn__icon" width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
            <path d="M21 15v4a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2v-4"></path>
            <polyline points="7 10 12 15 17 10"></polyline>
            <line x1="12" y1="15" x2="12" y2="3"></line>
          </svg>
          Brochure
        </a>
      </div>
    </nav>

    <a
      href="{% static 'files/SPARSH_8-Page_A4_Landscape_Brochure.pdf' %}"
      class="btn btn--brochure header-cta"
      data-track="header-brochure-cta"
      download="SPARSH_8-Page_A4_Landscape_Brochure.pdf"
      aria-label="Download Brochure"
    >
      <svg class="btn__icon" width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
        <path d="M21 15v4a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2v-4"></path>
        <polyline points="7 10 12 15 17 10"></polyline>
        <line x1="12" y1="15" x2="12" y2="3"></line>
      </svg>
      Brochure
    </a>
  </div>
</header>
